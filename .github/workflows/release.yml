name: release

on:
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid project version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Build release archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist
          archive="ComfyUI-DoRA-Dynamic-LoRA-Loader-v${VERSION}.zip"
          git archive \
            --format=zip \
            --prefix="ComfyUI-DoRA-Dynamic-LoRA-Loader-v${VERSION}/" \
            --output="dist/${archive}" \
            HEAD
          (cd dist && sha256sum "${archive}" > SHA256SUMS)

      - name: Verify release inputs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          archive="dist/ComfyUI-DoRA-Dynamic-LoRA-Loader-v${VERSION}.zip"
          prefix="ComfyUI-DoRA-Dynamic-LoRA-Loader-v${VERSION}"
          test -s "${archive}"
          test -s dist/SHA256SUMS
          test -s RELEASE_NOTES.md
          grep -F "ComfyUI-DoRA-Dynamic-LoRA-Loader-v${VERSION}.zip" dist/SHA256SUMS
          listing="$(unzip -Z1 "${archive}")"
          for required in \
            state_manager_api.py \
            state_manager_store.py \
            web/dora_state_manager.js; do
            printf '%s\n' "${listing}" | grep -Fx "${prefix}/${required}"
          done

      - name: Extract current release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ["TAG"]
          source = pathlib.Path("RELEASE_NOTES.md").read_text(encoding="utf-8")
          heading_re = re.compile(
              r"(?m)^# DoRA Dynamic LoRA Loader (v[0-9][0-9A-Za-z.-]*)[ \t]*$"
          )
          headings = list(heading_re.finditer(source))

          if not headings:
              raise SystemExit("RELEASE_NOTES.md contains no version release heading")
          if headings[0].group(1) != tag:
              raise SystemExit(
                  f"RELEASE_NOTES.md must start with the current release {tag}; "
                  f"found {headings[0].group(1)}"
              )
          if sum(match.group(1) == tag for match in headings) != 1:
              raise SystemExit(f"RELEASE_NOTES.md must contain exactly one heading for {tag}")

          end = headings[1].start() if len(headings) > 1 else len(source)
          notes = source[headings[0].start():end].rstrip() + "\n"
          output = pathlib.Path("dist/RELEASE_NOTES_CURRENT.md")
          output.write_text(notes, encoding="utf-8")
          print(f"Extracted {tag} release notes to {output}")
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if existing_target="$(gh release view "${TAG}" --json targetCommitish --jq .targetCommitish 2>/dev/null)"; then
            if [[ "${existing_target}" == "${RELEASE_SHA}" ]]; then
              echo "Release ${TAG} already exists for this tested commit; leaving it unchanged."
              exit 0
            fi
            echo "Release ${TAG} already targets ${existing_target}, not tested commit ${RELEASE_SHA}." >&2
            exit 1
          fi
          gh release create "${TAG}" \
            "dist/ComfyUI-DoRA-Dynamic-LoRA-Loader-v${VERSION}.zip" \
            dist/SHA256SUMS \
            --target "${RELEASE_SHA}" \
            --title "DoRA Dynamic LoRA Loader ${TAG}" \
            --notes-file dist/RELEASE_NOTES_CURRENT.md
