name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out custom node
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Compile Python sources
        run: python -m py_compile __init__.py nodes.py runtime_bypass.py state_manager_api.py state_manager_store.py

      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            node --check "${file}"
          done < <(find web -type f -name '*.js' -print0)

      - name: Run frontend regression tests
        run: node --test tests/test_frontend_state_persistence.mjs tests/test_frontend_widget_compatibility.mjs tests/test_state_manager_frontend.mjs tests/test_state_manager_distribution_safe_frontend.mjs

      - name: Build package wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps --wheel-dir /tmp/dora-loader-wheel .

      - name: Verify wheel was produced
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(/tmp/dora-loader-wheel/*.whl)
          test "${#wheels[@]}" -eq 1
          echo "Built ${wheels[0]}"

  impact-wildcard-contract:
    name: Impact Pack 8.28.3 · reviewed wildcard contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out custom node
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out reviewed Impact Pack source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ltdrdata/ComfyUI-Impact-Pack
          ref: 429d0159ad429e64d2b3916e6e7be9c22d025c3c
          path: .impact-pack-source

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install focused contract dependencies
        run: python -m pip install pytest numpy pyyaml

      - name: Stage reviewed Impact contract test outside package tree
        shell: bash
        run: |
          rm -rf /tmp/dora-impact-contract
          mkdir -p /tmp/dora-impact-contract
          cp tests/test_impact_wildcard_contract.py /tmp/dora-impact-contract/

      - name: Execute reviewed Impact handler and Processor semantics
        working-directory: /tmp/dora-impact-contract
        env:
          IMPACT_PACK_SOURCE: ${{ github.workspace }}/.impact-pack-source
        run: python -m pytest -q test_impact_wildcard_contract.py

  compatibility-and-runtime-bypass:
    name: ComfyUI ${{ matrix.comfy_version }} compatibility/runtime tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - comfy_version: v0.29.2
            comfy_ref: 322122449c9d2ba8b8df1bb517364527dd0615f1
            torch_version: "2.7.1"
            torchvision_version: "0.22.1"
            torchaudio_version: "2.7.1"
          - comfy_version: v0.30.2
            comfy_ref: dec5d9450a5290bcf63430409ea41018e67f41c3
            torch_version: "2.8.0"
            torchvision_version: "0.23.0"
            torchaudio_version: "2.8.0"
          - comfy_version: v0.31.1
            comfy_ref: fe4195f7f4275f2626cbafc703acc3ddde1e5490
            torch_version: "2.10.0"
            torchvision_version: "0.25.0"
            torchaudio_version: "2.10.0"
          - comfy_version: 2026-08-21
            comfy_ref: 28864ca8fed67cc05a957710f88ce23aff75fd2f
            torch_version: "2.10.0"
            torchvision_version: "0.25.0"
            torchaudio_version: "2.10.0"
    runs-on: ubuntu-latest
    steps:
      - name: Check out custom node
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out reviewed ComfyUI source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: Comfy-Org/ComfyUI
          ref: ${{ matrix.comfy_ref }}
          path: ComfyUI

      - name: Check out reviewed Impact Pack source
        if: matrix.comfy_version == '2026-08-21'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ltdrdata/ComfyUI-Impact-Pack
          ref: 429d0159ad429e64d2b3916e6e7be9c22d025c3c
          path: ImpactPack

      - name: Check out reviewed managed H3 Continuum source
        if: matrix.comfy_version == '2026-08-21'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: xmarre/ComfyUI-H3-Continuum-Plus
          ref: 330e9be43264b29a7ffa9e37db46fa3ceb0fd1a8
          path: H3Continuum

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned ComfyUI runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin a known CPU-only PyTorch family for every reviewed ComfyUI
          # revision. This keeps the compatibility matrix reproducible instead
          # of silently changing when PyTorch publishes a new stable wheel.
          python -m pip install \
            "torch==${{ matrix.torch_version }}" \
            "torchvision==${{ matrix.torchvision_version }}" \
            "torchaudio==${{ matrix.torchaudio_version }}" \
            --index-url https://download.pytorch.org/whl/cpu
          # Each matrix entry still owns the rest of its runtime dependency set.
          python -m pip install -r ComfyUI/requirements.txt
          python -m pip install pytest

      - name: Report pinned runtime versions
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          for package in ("torch", "torchvision", "torchaudio"):
              print(f"{package}={metadata.version(package)}")
          PY

      - name: Stage compatibility tests outside package tree
        shell: bash
        run: |
          rm -rf /tmp/dora-loader-tests
          cp -R tests /tmp/dora-loader-tests

      - name: Run compatibility and runtime-bypass tests
        working-directory: /tmp/dora-loader-tests
        env:
          DORA_REPO_ROOT: ${{ github.workspace }}
          COMFYUI_PATH: ${{ github.workspace }}/ComfyUI
          PYTHONPATH: ${{ github.workspace }}/ComfyUI
        run: python -m pytest -q --import-mode=importlib .

      - name: Run managed State Manager → real Impact → Continuum integration
        if: matrix.comfy_version == '2026-08-21'
        working-directory: /tmp/dora-loader-tests
        env:
          DORA_REPO_ROOT: ${{ github.workspace }}
          COMFYUI_PATH: ${{ github.workspace }}/ComfyUI
          PYTHONPATH: ${{ github.workspace }}/ComfyUI
          IMPACT_PACK_SOURCE: ${{ github.workspace }}/ImpactPack
          H3_CONTINUUM_SOURCE: ${{ github.workspace }}/H3Continuum
        run: python -m pytest -q --import-mode=importlib test_managed_transport_end_to_end.py
